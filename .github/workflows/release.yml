name: release
# Push a tag such as v0.10.0 to publish a release. The tag must match `version` in build.sh,
# and CHANGELOG.md must have a "## 0.10.0" section: it becomes the release notes.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write       # build provenance
  attestations: write   # build provenance
jobs:
  release:
    runs-on: macos-latest
    # The signing secrets live in this environment. Each run waits for the owner's approval.
    environment: release
    env:
      # Optional. With these secrets the app is signed with Developer ID and notarized by Apple.
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
      - run: ./test.sh
      - run: LIDLESS_CHANNEL=release ./build.sh --no-install
      - name: Check that the tag matches the app version
        run: |
          v=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/Lidless.app/Contents/Info.plist)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match version $v in build.sh"; exit 1; }
      - name: Sign with Developer ID and notarize
        if: env.DEVELOPER_ID_P12 != ''
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"; kp=$(uuidgen)
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          codesign --force --options runtime --timestamp --keychain "$kc" \
            --sign "Developer ID Application" build/Lidless.app
          codesign --verify --strict --deep --verbose=2 build/Lidless.app
          ditto -c -k --keepParent build/Lidless.app "$RUNNER_TEMP/notarize.zip"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/key.p8"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/key.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple build/Lidless.app
          spctl --assess --type execute --verbose=2 build/Lidless.app
          rm -f "$RUNNER_TEMP/id.p12" "$RUNNER_TEMP/key.p8"
          security delete-keychain "$kc"
      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent Lidless.app "Lidless-$GITHUB_REF_NAME.zip"
          shasum -a 256 "Lidless-$GITHUB_REF_NAME.zip" > "Lidless-$GITHUB_REF_NAME.zip.sha256"
      - name: Record build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/Lidless-*.zip
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## " v " ") == 1 {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
          cat >> notes.md <<'EOF'

          ## Install

          1. Download `Lidless-<version>.zip` below and open it.
          2. Move `Lidless.app` to your Applications folder, then open it.
          3. EOF_STEP3
          4. For the `lidless` command, open Lidless **Settings > Agents** and click **Install**.

          To update: quit Lidless, then replace the app with the new one.
          Check the download: `shasum -a 256 -c Lidless-<version>.zip.sha256`
          Check where it was built: `gh attestation verify Lidless-<version>.zip -R Ruelled/lidless`
          EOF
          if [ -n "$DEVELOPER_ID_P12" ]; then
            step3="The app is signed with Developer ID and notarized by Apple, so it opens without a warning."
          else
            step3="macOS says that it cannot check the app, because this build is not notarized. Open **System Settings > Privacy & Security**, scroll down, and click **Open Anyway**. Or run once in Terminal: \`xattr -dr com.apple.quarantine /Applications/Lidless.app\`"
          fi
          awk -v t="$step3" '{ if ($0 == "3. EOF_STEP3") print "3. " t; else print }' notes.md > notes.tmp && mv notes.tmp notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Lidless-*.zip build/Lidless-*.zip.sha256 --title "Lidless $GITHUB_REF_NAME" --notes-file notes.md
